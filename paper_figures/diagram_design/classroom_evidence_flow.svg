<path d="M 448,476 V 500 Q 448,508 440,508 H 328 Q 320,508 320,516 V 536" fill="none" stroke="#566574" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#classroom_evidence_flow-arrow-muted)"/>
<path d="M 672,476 V 500 Q 672,508 680,508 H 792 Q 800,508 800,516 V 536" fill="none" stroke="#566574" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#classroom_evidence_flow-arrow-muted)"/>
<path d="M 480,580 H 640" fill="none" stroke="#a61b1b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#classroom_evidence_flow-arrow-red)"/>
<path d="M 368,624 V 642 Q 368,650 376,650 H 492 Q 500,650 500,658 V 676" fill="none" stroke="#566574" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#classroom_evidence_flow-arrow-muted)"/>
<path d="M 752,624 V 642 Q 752,650 744,650 H 628 Q 620,650 620,658 V 676" fill="none" stroke="#a61b1b" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#classroom_evidence_flow-arrow-red)"/>
<g class="diagram-node">
<rect x="80" y="92" width="960" height="56" rx="7" fill="#fff4f2" stroke="#a61b1b" stroke-width="1.7"/>
<rect x="80" y="92" width="5" height="56" rx="2" fill="#a61b1b"/>
<text x="100" y="115" fill="#a61b1b" font-size="17" font-weight="600" text-anchor="start" >课堂视频与可选教学材料</text>
<text x="100" y="135" fill="#566574" font-size="12.5" font-weight="400" text-anchor="start" >讲稿 / 逐字稿、课程大纲、课件可作为补充输入</text>
</g>
<g class="diagram-node">
<rect x="80" y="212" width="288" height="96" rx="7" fill="#ffffff" stroke="#c8cfd3" stroke-width="1.2"/>
<text x="100" y="246" fill="#252d35" font-size="17" font-weight="600" text-anchor="start" >语言文本</text>
<text x="100" y="272" fill="#566574" font-size="12.5" font-weight="400" text-anchor="start" >FFmpeg 抽音；ASR 转写</text>
<text x="100" y="292" fill="#566574" font-size="12.5" font-weight="400" text-anchor="start" >有讲稿时以讲稿替代转写</text>
</g>
<g class="diagram-node">
<rect x="416" y="212" width="288" height="96" rx="7" fill="#ffffff" stroke="#c8cfd3" stroke-width="1.2"/>
<text x="436" y="246" fill="#252d35" font-size="17" font-weight="600" text-anchor="start" >声音与时间轴</text>
<text x="436" y="272" fill="#566574" font-size="12.5" font-weight="400" text-anchor="start" >响度、基频、停顿、语速</text>
<text x="436" y="292" fill="#566574" font-size="12.5" font-weight="400" text-anchor="start" >转写时间戳与课堂节奏</text>
</g>
<g class="diagram-node">
<rect x="752" y="212" width="288" height="96" rx="7" fill="#ffffff" stroke="#c8cfd3" stroke-width="1.2"/>
<text x="772" y="246" fill="#252d35" font-size="17" font-weight="600" text-anchor="start" >画面与课程材料</text>
<text x="772" y="272" fill="#566574" font-size="12.5" font-weight="400" text-anchor="start" >稀疏帧 VLM 标注；密集帧变化</text>
<text x="772" y="292" fill="#566574" font-size="12.5" font-weight="400" text-anchor="start" >课件 / 大纲解析</text>
</g>
<g class="diagram-node">
<rect x="344" y="388" width="432" height="88" rx="7" fill="#ffffff" stroke="#c8cfd3" stroke-width="1.2"/>
<text x="364" y="422" fill="#252d35" font-size="17" font-weight="600" text-anchor="start" >结构化课堂证据包</text>
<text x="364" y="448" fill="#566574" font-size="12.5" font-weight="400" text-anchor="start" >七类、69 个字段按可用模态提取</text>
<text x="364" y="468" fill="#566574" font-size="12.5" font-weight="400" text-anchor="start" >原始观察与教学判断分离；缺失不补零</text>
</g>
<g class="diagram-node">
<rect x="160" y="536" width="320" height="88" rx="7" fill="#ffffff" stroke="#c8cfd3" stroke-width="1.2"/>
<text x="180" y="570" fill="#252d35" font-size="17" font-weight="600" text-anchor="start" >五维教学判断</text>
<text x="180" y="596" fill="#566574" font-size="12.5" font-weight="400" text-anchor="start" >25 项二级指标与证据依据</text>
<text x="180" y="616" fill="#566574" font-size="12.5" font-weight="400" text-anchor="start" >证据不足标记“未评估”</text>
</g>
<g class="diagram-node">
<rect x="640" y="536" width="320" height="88" rx="7" fill="#ffffff" stroke="#c8cfd3" stroke-width="1.2"/>
<text x="660" y="570" fill="#252d35" font-size="17" font-weight="600" text-anchor="start" >GB 综合评分</text>
<text x="660" y="596" fill="#566574" font-size="12.5" font-weight="400" text-anchor="start" >客观特征 + 五维判断结果</text>
<text x="660" y="616" fill="#566574" font-size="12.5" font-weight="400" text-anchor="start" >线上五分类模型生成综合分</text>
</g>
<g class="diagram-node">
<rect x="360" y="676" width="400" height="56" rx="7" fill="#fff4f2" stroke="#a61b1b" stroke-width="1.7"/>
<rect x="360" y="676" width="5" height="56" rx="2" fill="#a61b1b"/>
<text x="380" y="699" fill="#a61b1b" font-size="17" font-weight="600" text-anchor="start" >可追溯评估报告</text>
<text x="380" y="719" fill="#566574" font-size="12.5" font-weight="400" text-anchor="start" >维度结果、综合分、指标依据与建议</text>
</g>
<line x1="80" y1="752" x2="1040" y2="752" stroke="#c8cfd3"/>
<text x="80" y="776" fill="#6a7782" font-size="11" font-weight="400" text-anchor="start" >报告摘要可写入本人私有索引，由教师选择后用于后续问答。</text>
</svg>
