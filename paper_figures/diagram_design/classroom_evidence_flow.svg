<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1120 792" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="classroom-evidence-title classroom-evidence-desc" id="classroom_evidence_flow-root">
  <title id="classroom-evidence-title">课堂证据处理流程图</title>
  <desc id="classroom-evidence-desc">课堂视频和可选材料分路形成语言、声音时间轴和画面材料信息，再汇聚为结构化证据包，进入五维教学判断和 GB 综合评分，生成可追溯报告。</desc>
  <defs>
      <style>#classroom_evidence_flow-root { color: #252d35; font-family: PingFang SC, Noto Sans SC, Microsoft YaHei, sans-serif; }
      #classroom_evidence_flow-root .diagram-container { width:100%;overflow-x:auto }
      @media print {
#classroom_evidence_flow-root .diagram-container { overflow-x:visible }
}</style>
    <marker id="classroom_evidence_flow-arrow-muted" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#566574"/></marker>
    <marker id="classroom_evidence_flow-arrow-red" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><polygon points="0 0, 9 3.5, 0 7" fill="#a61b1b"/></marker>
  </defs>
  <rect width="1120" height="792" fill="#fbfaf8"/>
  <text x="80" y="52" fill="#a61b1b" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.2">01</text>
<text x="114" y="52" fill="#6a7782" font-size="13" font-weight="600" text-anchor="start" >输入与多模态采集</text>
<text x="80" y="360" fill="#a61b1b" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.2">02</text>
<text x="114" y="360" fill="#6a7782" font-size="13" font-weight="600" text-anchor="start" >证据结构化</text>
<text x="80" y="508" fill="#a61b1b" font-size="12" font-weight="700" text-anchor="start" letter-spacing="1.2">03</text>
<text x="114" y="508" fill="#6a7782" font-size="13" font-weight="600" text-anchor="start" >判断、评分与输出</text>
<line x1="80" y1="68" x2="1040" y2="68" stroke="#c8cfd3" stroke-width="1"/>
<line x1="80" y1="376" x2="1040" y2="376" stroke="#c8cfd3" stroke-width="1"/>
<line x1="80" y1="524" x2="1040" y2="524" stroke="#c8cfd3" stroke-width="1"/>
